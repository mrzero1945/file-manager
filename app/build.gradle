plugins {
    id 'com.android.application'
}

// Release credentials live in <root>/keystore.properties (git-ignored) so they
// never end up in the build script. Falls back to env vars for CI.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.mrzero.filemanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mrzero.filemanager'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey('storeFile')) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            if (keystoreProps.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig true
    }

    // The metadata engine (readdir/stat/sort/walk) lives in C++ because the
    // Java File API costs 2-3 stat() syscalls per entry and allocates a File
    // plus several Strings for each one. See app/src/main/cpp/af_fs.cpp.
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            output -> output.outputFileName = "AppleFiles-${variant.name}-${variant.versionName}.apk".toString()
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
}
